{% if messages %}
    <div class="container-fluid px-0">
        <div class="px-4 pt-3">

            {% for message in messages %}
                <div
                    class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                    role="alert"
                >
                    {{ message }}

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="Close"
                    ></button>
                </div>
            {% endfor %}

        </div>
    </div>
{% endif %}
