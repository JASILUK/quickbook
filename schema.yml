openapi: 3.0.3
info:
  title: ''
  version: 0.0.0
paths:
  /api/auth/customers/:
    get:
      operationId: auth_customers_retrieve
      description: Staff-only customer list.
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/auth/customers/{user_id}/:
